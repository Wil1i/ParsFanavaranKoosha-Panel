<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>پنل مدیریت کارخانه کمپوست</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

  :root{
    --bg:#f0eee4; --surface:#ffffff; --border:#e6e0cc; --soft:#f6f4e9;
    --primary:#3f5d3a; --primary-dark:#2f4a2b;
    --text:#2b2822; --muted:#6b6350; --muted2:#9a917c;
    --warn-bg:#fbf1e2; --warn-text:#8a5e1f;
    --danger-bg:#fbeae6; --danger-text:#a13f26;
    --good-bg:#eef4e8;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--text);
    font-family:'Vazirmatn','Tahoma',sans-serif;
    font-size:14px; line-height:1.6; min-height:100vh;
  }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#d3ccb4; border-radius:4px; }

  .wrap{ max-width:1080px; margin:0 auto; padding:0 16px; }
  header.top{ background:var(--primary); color:#fff; position:relative; }
  .top-inner{ display:flex; align-items:center; justify-content:space-between; padding:18px 0; gap:12px; }
  .top-inner h1{ margin:0; font-size:20px; font-weight:800; }
  .top-inner p{ margin:4px 0 0; font-size:12.5px; color:#cfe0c4; }
  .top-right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .logo-badge{
    width:44px; height:44px; border-radius:50%; display:grid; place-items:center;
    font-size:18px; font-weight:900; flex-shrink:0;
    background:linear-gradient(135deg,#8fae5f,#4a3728);
  }
  .hamburger{
    display:none; width:40px; height:40px; border-radius:10px; border:none; cursor:pointer;
    background:rgba(255,255,255,.12); flex-direction:column; align-items:center; justify-content:center; gap:4px;
  }
  .hamburger:hover{ background:rgba(255,255,255,.2); }
  .hamburger .bar{ display:block; width:19px; height:2px; background:#fff; border-radius:2px; transition:.2s; }
  .hamburger.open .bar:nth-child(1){ transform:translateY(6px) rotate(45deg); }
  .hamburger.open .bar:nth-child(2){ opacity:0; }
  .hamburger.open .bar:nth-child(3){ transform:translateY(-6px) rotate(-45deg); }

  nav.tabs{ display:flex; gap:4px; }
  nav.tabs button{
    border:none; cursor:pointer; padding:10px 16px; font-size:13.5px; font-weight:600;
    border-radius:10px 10px 0 0; background:transparent; color:#dfeacf;
    font-family:inherit; transition:.15s; width:100%; text-align:right;
  }
  nav.tabs button.active{ background:var(--bg); color:var(--text); }
  nav.tabs button:not(.active):hover{ background:rgba(255,255,255,.12); }

  main{ padding:24px 0 60px; }

  .stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:24px; }
  .stat-row.two{ grid-template-columns:repeat(2,1fr); }
  .stat-row.four{ grid-template-columns:repeat(4,1fr); }
  .stat-row.five{ grid-template-columns:repeat(5,1fr); }

  @media(max-width:640px){
    .hamburger{ display:flex; }
    .top-inner h1{ font-size:17px; }
    .top-inner p{ display:none; }
    nav.tabs{
      display:none; flex-direction:column; position:absolute; inset-inline:0; top:100%;
      background:var(--primary-dark); padding:8px 16px 14px; gap:2px; z-index:45;
      box-shadow:0 12px 24px rgba(0,0,0,.18);
    }
    nav.tabs.open{ display:flex; }
    nav.tabs button{ border-radius:10px; padding:12px 14px; color:#e9f0e0; }
    nav.tabs button.active{ background:rgba(255,255,255,.16); color:#fff; }
  }
  @media(max-width:860px){
    .stat-row.five{ grid-template-columns:repeat(3,1fr); }
  }
  @media(max-width:520px){
    .stat-row{ grid-template-columns:repeat(2,1fr); }
    .stat-row.four{ grid-template-columns:repeat(2,1fr); }
    .stat-row.five{ grid-template-columns:repeat(2,1fr); }
  }
  .chip{ border:1px solid var(--border); border-radius:14px; padding:14px 16px; background:var(--surface); }
  .chip.good{ background:var(--good-bg); border-color:#d3e4c4; }
  .chip.warn{ background:var(--warn-bg); border-color:#eddcb3; }
  .chip .v{ font-size:20px; font-weight:800; line-height:1; }
  .chip.good .v{ color:var(--primary); }
  .chip.warn .v{ color:var(--warn-text); }
  .chip .l{ font-size:12px; margin-top:6px; opacity:.8; }

  .section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
  .section-head h2{ font-size:16px; font-weight:800; margin:0; }

  .btn{
    border:none; cursor:pointer; border-radius:10px; font-weight:600; font-family:inherit;
    padding:10px 16px; font-size:14px; display:inline-flex; align-items:center; gap:6px;
    transition:.15s;
  }
  .btn.small{ padding:6px 12px; font-size:12.5px; border-radius:8px; }
  .btn.primary{ background:var(--primary); color:#fff; }
  .btn.primary:hover{ background:var(--primary-dark); }
  .btn.secondary{ background:#efe9d6; color:var(--primary); }
  .btn.secondary:hover{ background:#e6dfc6; }
  .btn.danger{ background:var(--danger-bg); color:var(--danger-text); }
  .btn.danger:hover{ background:#f6d9d1; }
  .btn.ghost{ background:transparent; color:var(--muted); }
  .btn.ghost:hover{ background:#efe9d6; }
  .btn.full{ width:100%; justify-content:center; }

  .empty{
    text-align:center; padding:60px 20px; border:1.5px dashed var(--border);
    border-radius:18px; background:rgba(255,255,255,.6);
  }
  .empty p{ color:var(--muted); margin:0 0 14px; }

  .grid-cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px; }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:16px;
    display:flex; flex-direction:column; gap:12px; cursor:pointer; transition:.15s;
  }
  .card:hover{ box-shadow:0 6px 18px rgba(43,40,34,.08); }
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .card-top h3{ margin:0; font-size:15px; font-weight:700; line-height:1.4; }

  .badge{ font-size:11px; font-weight:800; padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .badge.ready{ background:var(--primary); color:#fff; }
  .badge.pending{ background:#efe4c9; color:var(--warn-text); }
  .badge.danger{ background:var(--danger-bg); color:var(--danger-text); }

  .gauge-label{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; font-size:12px; }
  .gauge-label .a{ color:var(--muted); font-weight:500; }
  .gauge-label .b{ color:var(--muted2); }
  .gauge-track{ height:10px; border-radius:999px; background:#e9e3cf; overflow:hidden; }
  .gauge-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg,#8fae5f 0%,#6f8f4d 35%,#7a5c3e 75%,#4a3728 100%); }

  .mini-stats{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .mini-box{ background:var(--soft); border-radius:10px; padding:8px 10px; }
  .mini-box .l{ font-size:12px; color:var(--muted2); }
  .mini-box .v{ font-size:15px; font-weight:800; }
  .mini-box .v.accent{ color:var(--primary); }

  .back-link{ background:none; border:none; cursor:pointer; color:var(--primary); font-weight:700; font-size:13.5px; padding:0; margin-bottom:16px; font-family:inherit; }
  .back-link:hover{ text-decoration:underline; }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:20px; margin-bottom:20px; }
  .panel-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .panel-head h2{ font-size:18px; font-weight:800; margin:0; }
  .panel-head .meta{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .panel-head .note{ font-size:12.5px; color:var(--muted2); margin-top:4px; }
  .actions{ display:flex; gap:8px; }

  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media(max-width:860px){ .two-col{ grid-template-columns:1fr; } }

  .list-card{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:16px; }
  .list-card-head{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:12px; gap:8px;}
  .list-card-head h3{ margin:0; font-size:14.5px; font-weight:800; }
  .list-card-head .sum{ font-size:12px; color:var(--muted2); margin-top:2px; }
  .empty-mini{ text-align:center; padding:24px 0; color:var(--muted2); font-size:13px; }

  .invoice-row{ border:1px solid #eee8d6; border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:13px; }
  .invoice-row .r1{ display:flex; align-items:center; justify-content:space-between; }
  .invoice-row .r1 .name{ font-weight:700; }
  .invoice-row .r1 .date{ color:var(--muted); font-size:12.5px; }
  .invoice-row .r2{ display:flex; align-items:center; justify-content:space-between; margin-top:4px; color:var(--muted); }
  .invoice-row .r2 .tot{ font-weight:800; color:var(--text); }
  .invoice-row .r3{ font-size:12px; color:var(--muted2); margin-top:4px; }
  .invoice-row .r4{ display:flex; gap:6px; margin-top:8px; }

  table.wh{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.wh thead tr{ background:var(--soft); color:var(--muted); font-size:12.5px; }
  table.wh th{ text-align:right; padding:12px 14px; font-weight:700; }
  table.wh td{ padding:12px 14px; border-top:1px solid #eee8d6; }
  table.wh .stock{ font-weight:800; }
  .stock-ok{ color:var(--primary); }
  .stock-low{ color:var(--warn-text); }
  .stock-out{ color:var(--danger-text); }
  .wh-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .wh-card-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:18px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table.wh{ min-width:640px; }

  .save-err{ margin-bottom:16px; font-size:13px; background:var(--danger-bg); color:var(--danger-text); border-radius:10px; padding:10px 14px; }

  /* modal */
  .overlay{
    position:fixed; inset:0; z-index:50; background:rgba(27,26,20,.5); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .modal{
    background:#faf8f1; width:100%; max-width:480px; max-height:92vh; overflow-y:auto;
    border-radius:18px; box-shadow:0 20px 60px rgba(0,0,0,.25); border:1px solid var(--border);
  }
  .modal.wide{ max-width:640px; }
  .modal-head{
    position:sticky; top:0; background:#faf8f1; display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--border);
  }
  .modal-head h3{ margin:0; font-size:16px; font-weight:800; }
  .modal-close{ width:32px; height:32px; border-radius:50%; border:none; background:transparent; cursor:pointer; font-size:18px; color:var(--muted); }
  .modal-close:hover{ background:#efe9d6; }
  .modal-body{ padding:20px; }

  .field{ display:block; margin-bottom:14px; }
  .field .lbl{ display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:6px; }
  .field .hint{ display:block; font-size:11px; color:var(--muted2); margin-top:5px; }
  .inp, select.inp, textarea.inp{
    width:100%; border:1px solid #d9d2bd; background:#fff; border-radius:10px; padding:9px 12px;
    font-size:14px; color:var(--text); font-family:inherit; outline:none; transition:.15s;
  }
  .inp:focus{ border-color:var(--primary); box-shadow:0 0 0 3px rgba(63,93,58,.12); }
  textarea.inp{ resize:vertical; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .jdate{ display:flex; gap:6px; }
  .jdate select{ flex:1; min-width:0; padding-left:4px; padding-right:4px; }
  .total-preview{ font-size:13px; color:var(--muted); margin-bottom:14px; }
  .total-preview b{ color:var(--text); }
  .modal-actions{ display:flex; gap:8px; margin-top:6px; }

  .loading-screen{ min-height:100vh; display:grid; place-items:center; color:var(--muted); }

  /* login screen */
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{
    width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border);
    border-radius:20px; padding:28px 26px; box-shadow:0 10px 30px rgba(43,40,34,.08);
  }
  .login-logo{
    width:56px; height:56px; border-radius:16px; display:grid; place-items:center; font-size:24px;
    background:linear-gradient(135deg,#8fae5f,#4a3728); margin:0 auto 16px;
  }
  .login-card h1{ font-size:17px; text-align:center; margin:0 0 4px; }
  .login-card p.sub{ font-size:12.5px; text-align:center; color:var(--muted2); margin:0 0 22px; }
  .login-err{ font-size:13px; background:var(--danger-bg); color:var(--danger-text); border-radius:10px; padding:9px 12px; margin-bottom:14px; }

  /* header user badge */
  .user-badge{ display:flex; align-items:center; gap:10px; }
  .user-badge .who{ text-align:left; }
  .user-badge .name{ font-size:12.5px; font-weight:700; }
  .user-badge .role{ font-size:11px; color:#cfe0c4; }
  .logout-btn{
    border:none; cursor:pointer; background:rgba(255,255,255,.14); color:#fff; border-radius:8px;
    padding:7px 12px; font-size:12px; font-family:inherit; font-weight:600;
  }
  .logout-btn:hover{ background:rgba(255,255,255,.24); }

  .spin{
    width:16px; height:16px; border-radius:50%; border:2px solid rgba(63,93,58,.25);
    border-top-color:var(--primary); display:inline-block; animation:spin .7s linear infinite; vertical-align:middle;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .btn[disabled]{ opacity:.6; cursor:default; }
</style>
</head>
<body>

<div id="app">
  <div class="loading-screen" id="loading">در حال بارگذاری…</div>
</div>
<div id="modal-root"></div>

<script>
/* =====================================================================
   پنل مدیریت کارخانه کمپوست — نسخه متصل به بک‌اند (Express + Sequelize + MySQL)
   قبل از استفاده، آدرس API_BASE را با آدرس سرور خودتان جایگزین کنید.
   ===================================================================== */

const API_BASE = "http://localhost:4000/api"; // TODO: آدرس بک‌اند خودتان را اینجا بگذارید

const UNITS = ["کیلوگرم", "تن", "کیسه", "متر مکعب", "عدد"];

let AUTH = { token: null, user: null };

/* --- نگهداری نشست ورود در localStorage تا با رفرش صفحه خارج نشوید ---
   نکته: اگر این فایل داخل پیش‌نمایش آرتیفکت (artifact) کلود باز شود، localStorage
   کار نمی‌کند و مرورگر آن را نادیده می‌گیرد؛ برای استفاده‌ی واقعی، فایل را دانلود و
   در سرور/میزبان خودتان اجرا کنید تا نشست ورود روزانه به‌درستی حفظ شود. */
const AUTH_STORAGE_KEY = "compost-panel-auth-v1";

function saveAuthToStorage(){
  try{ localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(AUTH)); }catch(e){ /* storage unavailable */ }
}
function loadAuthFromStorage(){
  try{
    const raw = localStorage.getItem(AUTH_STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearAuthStorage(){
  try{ localStorage.removeItem(AUTH_STORAGE_KEY); }catch(e){ /* storage unavailable */ }
}
let DB = { batches: [], items: [], users: [], dashboard: null, logs: null, integrationSettings: null, webOrders: null, customers: [] };
let UI = {
  tab: null,
  openBatchId: null,
  batchDetail: null,
  menuOpen: false,
  saveError: "",
  loginError: "",
  busy: false,
  logFilters: { entityType:"", action:"", q:"", page:1, limit:50 },
  webOrderFilters: { status:"", q:"", page:1, limit:30 },
  integrationBusy: false,
  integrationMessage: "",
};

/* ===================== helpers ===================== */

function toNum(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function fmt(n){ return (Math.round((toNum(n) + Number.EPSILON) * 100) / 100).toLocaleString("fa-IR"); }
function fmtDate(iso){
  if(!iso) return "—";
  try{ return new Date(iso).toLocaleDateString("fa-IR", { year:"numeric", month:"2-digit", day:"2-digit" }); }
  catch(e){ return iso; }
}
function fmtDateTime(iso){
  if(!iso) return "—";
  try{
    const d = new Date(iso);
    const date = d.toLocaleDateString("fa-IR", { year:"numeric", month:"2-digit", day:"2-digit" });
    const time = d.toLocaleTimeString("fa-IR", { hour:"2-digit", minute:"2-digit" });
    return `${date}  -  ${time}`;
  }catch(e){ return iso; }
}
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ===================== تقویم شمسی (جلالی) ===================== */

function jDiv(a,b){ return Math.floor(a/b); }

function gregorianToJalali(gy, gm, gd){
  const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  let jy;
  if (gy > 1600) { jy = 979; gy -= 1600; } else { jy = 0; gy -= 621; }
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365 * gy) + jDiv((gy2 + 3), 4) - jDiv((gy2 + 99), 100) + jDiv((gy2 + 399), 400) - 80 + gd + g_d_m[gm - 1];
  jy += 33 * jDiv(days, 12053);
  days %= 12053;
  jy += 4 * jDiv(days, 1461);
  days %= 1461;
  if (days > 365) { jy += jDiv((days - 1), 365); days = (days - 1) % 365; }
  let jm, jd;
  if (days < 186) { jm = 1 + jDiv(days, 31); jd = 1 + (days % 31); }
  else { jm = 7 + jDiv((days - 186), 30); jd = 1 + ((days - 186) % 30); }
  return [jy, jm, jd];
}

function jalaliToGregorian(jy, jm, jd){
  let gy;
  if (jy > 979) { gy = 1600; jy -= 979; } else { gy = 621; }
  let days = (365 * jy) + (jDiv(jy, 33) * 8) + jDiv(((jy % 33) + 3), 4) + 78 + jd
    + ((jm < 7) ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
  gy += 400 * jDiv(days, 146097);
  days %= 146097;
  if (days > 36524) {
    gy += 100 * jDiv(--days, 36524);
    days %= 36524;
    if (days >= 365) days++;
  }
  gy += 4 * jDiv(days, 1461);
  days %= 1461;
  if (days > 365) { gy += jDiv((days - 1), 365); days = (days - 1) % 365; }
  let gd = days + 1;
  const sal_a = [0, 31, ((gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0)) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  let gm;
  for (gm = 1; gm <= 12; gm++) { if (gd <= sal_a[gm]) break; gd -= sal_a[gm]; }
  return [gy, gm, gd];
}

const JALALI_MONTHS = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];

function jalaliMonthLength(jy, jm){
  if (jm <= 6) return 31;
  if (jm <= 11) return 30;
  const a = Date.UTC(...jalaliToGregorian(jy, 1, 1).map((v,i)=> i===1 ? v-1 : v));
  const b = Date.UTC(...jalaliToGregorian(jy+1, 1, 1).map((v,i)=> i===1 ? v-1 : v));
  return Math.round((b - a) / 86400000) === 366 ? 30 : 29;
}

function isoToJalaliParts(iso){
  if(iso){
    const [gy,gm,gd] = iso.split("-").map(Number);
    if(gy && gm && gd) return gregorianToJalali(gy, gm, gd);
  }
  const now = new Date();
  return gregorianToJalali(now.getFullYear(), now.getMonth()+1, now.getDate());
}

function jalaliPartsToISO(jy, jm, jd){
  const [gy,gm,gd] = jalaliToGregorian(jy, jm, jd);
  return `${gy}-${String(gm).padStart(2,"0")}-${String(gd).padStart(2,"0")}`;
}

/** یک تقویم شمسی (سه انتخاب‌گر روز/ماه/سال) که مقدار میلادی معادل را در یک input مخفی با همان id نگه می‌دارد */
function jalaliDateFieldHtml(fieldId, isoValue){
  const [jy, jm, jd] = isoToJalaliParts(isoValue);
  const dayCount = jalaliMonthLength(jy, jm);
  const dayOpts = Array.from({length:dayCount}, (_,i)=>i+1)
    .map(d => `<option value="${d}" ${d===jd?"selected":""}>${d}</option>`).join("");
  const monthOpts = JALALI_MONTHS
    .map((name,i) => `<option value="${i+1}" ${(i+1)===jm?"selected":""}>${name}</option>`).join("");
  const years = []; for(let y = jy-6; y <= jy+3; y++) years.push(y);
  const yearOpts = years.map(y => `<option value="${y}" ${y===jy?"selected":""}>${y}</option>`).join("");
  const isoVal = isoValue || jalaliPartsToISO(jy, jm, jd);
  return `
    <div class="jdate" data-field="${fieldId}">
      <input type="hidden" id="${fieldId}" value="${esc(isoVal)}" />
      <select class="inp jd-part" data-part="day">${dayOpts}</select>
      <select class="inp jd-part" data-part="month">${monthOpts}</select>
      <select class="inp jd-part" data-part="year">${yearOpts}</select>
    </div>
  `;
}

/** باید بعد از قرار گرفتن jalaliDateFieldHtml در DOM صدا زده شود */
function wireJalaliDateField(fieldId){
  const wrap = document.querySelector(`.jdate[data-field="${fieldId}"]`);
  if(!wrap) return;
  const hidden = document.getElementById(fieldId);
  const daySel = wrap.querySelector('[data-part="day"]');
  const monthSel = wrap.querySelector('[data-part="month"]');
  const yearSel = wrap.querySelector('[data-part="year"]');

  function sync(){
    const jy = toNum(yearSel.value), jm = toNum(monthSel.value);
    const maxDay = jalaliMonthLength(jy, jm);
    let jd = toNum(daySel.value);
    if(daySel.options.length !== maxDay){
      jd = Math.min(jd, maxDay);
      daySel.innerHTML = Array.from({length:maxDay}, (_,i)=>i+1)
        .map(d => `<option value="${d}" ${d===jd?"selected":""}>${d}</option>`).join("");
    }
    hidden.value = jalaliPartsToISO(jy, jm, jd);
  }
  daySel.addEventListener("change", sync);
  monthSel.addEventListener("change", sync);
  yearSel.addEventListener("change", sync);
}

/* ===================== API client ===================== */

async function api(path, opts = {}){
  const headers = { "Content-Type": "application/json" };
  if(AUTH.token) headers["Authorization"] = "Bearer " + AUTH.token;

  let res;
  try{
    res = await fetch(API_BASE + path, {
      method: opts.method || "GET",
      headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
  }catch(networkErr){
    throw new Error("اتصال به سرور برقرار نشد. آدرس API_BASE و روشن بودن بک‌اند را بررسی کنید.");
  }

  if(res.status === 401){
    AUTH.token = null; AUTH.user = null;
    clearAuthStorage();
    UI.loginError = "نشست شما منقضی شده یا نامعتبر است. دوباره وارد شوید.";
    render();
    throw new Error(UI.loginError);
  }

  if(res.status === 204) return null;

  let data = null;
  try{ data = await res.json(); }catch(e){ /* empty body */ }

  if(!res.ok){
    throw new Error((data && data.message) || "خطایی رخ داد.");
  }
  return data;
}

/* ===================== auth ===================== */

function accessibleTabs(){
  const u = AUTH.user;
  if(!u) return [];
  const tabs = [{ key:"dashboard", label:"داشبورد" }];
  if(u.isAdmin || u.canAccessBatches) tabs.push({ key:"batches", label:"کشت‌ها" });
  if(u.isAdmin || u.canAccessBatches) tabs.push({ key:"customers", label:"مشتریان" });
  if(u.isAdmin || u.canAccessWarehouse) tabs.push({ key:"warehouse", label:"انبار کالا" });
  if(u.isAdmin) tabs.push({ key:"users", label:"کاربران" });
  if(u.isAdmin) tabs.push({ key:"logs", label:"لاگ فعالیت‌ها" });
  if(u.isAdmin) tabs.push({ key:"integration", label:"اتصال فروشگاه اینترنتی" });
  return tabs;
}

async function afterLogin(){
  const tabs = accessibleTabs();
  if(tabs.length === 0){
    UI.loginError = "این کاربر به هیچ بخشی دسترسی ندارد. با مدیر سیستم تماس بگیرید.";
    AUTH = { token:null, user:null };
    render();
    return;
  }
  UI.tab = tabs[0].key;
  UI.saveError = "";
  await loadForTab(UI.tab);
}

function logout(){
  AUTH = { token:null, user:null };
  clearAuthStorage();
  DB = { batches:[], items:[], users:[], dashboard:null, logs:null, integrationSettings:null, webOrders:null, customers:[] };
  UI = { tab:null, openBatchId:null, batchDetail:null, menuOpen:false, saveError:"", loginError:"", busy:false };
  render();
}

async function loadForTab(tab){
  try{
    if(tab === "dashboard") DB.dashboard = await api("/dashboard");
    else if(tab === "batches") DB.batches = await api("/batches");
    else if(tab === "customers") DB.customers = await api("/customers");
    else if(tab === "warehouse") DB.items = await api("/items");
    else if(tab === "users") DB.users = await api("/users");
    else if(tab === "logs") await loadLogs();
    else if(tab === "integration") await Promise.all([loadIntegrationSettings(), loadWebOrders(), (async()=>{ try{ DB.batches = await api("/batches"); }catch(e){} })()]);
    UI.saveError = "";
  }catch(err){
    UI.saveError = err.message;
  }
  render();
}

function buildLogQuery(){
  const f = UI.logFilters;
  const params = new URLSearchParams();
  params.set("page", f.page);
  params.set("limit", f.limit);
  if(f.entityType) params.set("entityType", f.entityType);
  if(f.action) params.set("action", f.action);
  if(f.q) params.set("q", f.q);
  return params.toString();
}

async function loadLogs(){
  try{
    DB.logs = await api("/logs?" + buildLogQuery());
    UI.saveError = "";
  }catch(err){
    UI.saveError = err.message;
  }
}

async function loadIntegrationSettings(){
  try{ DB.integrationSettings = await api("/integrations/woocommerce"); }
  catch(err){ UI.saveError = err.message; }
}

function buildWebOrderQuery(){
  const f = UI.webOrderFilters;
  const params = new URLSearchParams();
  params.set("page", f.page);
  params.set("limit", f.limit);
  if(f.status) params.set("status", f.status);
  if(f.q) params.set("q", f.q);
  return params.toString();
}

async function loadWebOrders(){
  try{ DB.webOrders = await api("/web-orders?" + buildWebOrderQuery()); }
  catch(err){ UI.saveError = err.message; }
}

async function reloadBatchAndList(batchId){
  try{
    const [detail, list] = await Promise.all([ api("/batches/" + batchId), api("/batches") ]);
    UI.batchDetail = detail;
    DB.batches = list;
    UI.saveError = "";
  }catch(err){
    UI.saveError = err.message;
  }
  render();
}

const ACTION_LABELS = {
  LOGIN: "ورود",
  BATCH_CREATE: "ایجاد کشت", BATCH_UPDATE: "ویرایش کشت", BATCH_DELETE: "حذف کشت",
  PURCHASE_CREATE: "ثبت فاکتور خرید", PURCHASE_UPDATE: "ویرایش فاکتور خرید", PURCHASE_DELETE: "حذف فاکتور خرید",

function actionBadgeTone(action){
  if(action.endsWith("_DELETE")) return "danger";
  if(action.endsWith("_CREATE") || action === "LOGIN") return "ready";
  return "pending";
}

/* ===================== modals ===================== */

function closeModal(){ document.getElementById("modal-root").innerHTML = ""; }

function modalShell(title, bodyHtml){
  document.getElementById("modal-root").innerHTML = `
    <div class="overlay" id="overlay">
      <div class="modal">
        <div class="modal-head">
          <h3>${esc(title)}</h3>
          <button class="modal-close" data-action="close-modal">×</button>
        </div>
        <div class="modal-body">${bodyHtml}</div>
      </div>
    </div>
  `;
  document.getElementById("overlay").addEventListener("click", (e) => { if(e.target.id === "overlay") closeModal(); });
}

function modalErr(msg){
  const el = document.getElementById("modal-err");
  if(el) el.textContent = msg || "";
}

async function saveBatchFromModal(id){
  const name = document.getElementById("f-name").value.trim();
  const startDate = document.getElementById("f-startDate").value;
  const readyDays = document.getElementById("f-readyDays").value;
  if(!name || !startDate || !readyDays){ modalErr("نام، تاریخ شروع و روز تا آماده شدن الزامی است."); document.getElementById("modal-err").style.display="block"; return; }
  const payload = {
    name, startDate, readyDays: toNum(readyDays),
    productionQty: toNum(document.getElementById("f-productionQty").value),
    unit: document.getElementById("f-unit").value,
    note: document.getElementById("f-note").value.trim(),
  };
  try{
    if(id) await api("/batches/" + id, { method:"PUT", body: payload });
    else await api("/batches", { method:"POST", body: payload });
    closeModal();
    await loadBatches();
    if(id && UI.openBatchId === id) await reloadBatchAndList(id);
  }catch(err){
    modalErr(err.message); document.getElementById("modal-err").style.display="block";
  }
}

async function deleteBatch(id){
  try{
    await api("/batches/" + id, { method:"DELETE" });
    if(UI.openBatchId === id){ UI.openBatchId = null; UI.batchDetail = null; }
    await loadBatches();
  }catch(err){ UI.saveError = err.message; render(); }
}

async function openSaleModal(batchId, sale){
  try{ DB.customers = await api("/customers"); }catch(e){ /* دراپ‌داون فقط بدون گزینه می‌ماند */ }
  const editing = !!sale;
  const batch = (UI.batchDetail && UI.batchDetail.id === batchId) ? UI.batchDetail : DB.batches.find(x => x.id === batchId);
  const s = sale || { batchId, date: todayISO(), qty:"", unitPrice:"", customer:"", customerId:"", paidAmount:"0", paymentTrackingNumber:"", note:"" };

  const matchedCustomer = s.customerId ? DB.customers.find(c => c.id === s.customerId) : null;
  const isCustomCustomer = !!s.customer && !matchedCustomer;

  modalShell(editing ? "ویرایش فاکتور فروش" : "فاکتور فروش جدید", `
    <div id="modal-err" class="login-err" style="display:none;"></div>
    <label class="field"><span class="lbl">تاریخ</span>${jalaliDateFieldHtml("f-date", s.date)}</label>
    <div class="row2">
      <label class="field"><span class="lbl">مقدار</span><input type="number" min="0" class="inp" id="f-qty" value="${esc(s.qty)}" /></label>
      <label class="field"><span class="lbl">واحد</span>
        <select class="inp" id="f-unit">${UNITS.map(u=>`<option value="${u}" ${(s.unit || (batch?batch.unit:UNITS[0]))===u?'selected':''}>${u}</option>`).join("")}</select>
      </label>
    </div>
    <label class="field"><span class="lbl">قیمت واحد (تومان)</span><input type="number" min="0" class="inp" id="f-unitPrice" value="${esc(s.unitPrice)}" /></label>
    <div class="total-preview">جمع فاکتور: <b id="f-total-preview">${fmt(toNum(s.qty)*toNum(s.unitPrice))}</b> تومان</div>

    <label class="field"><span class="lbl">مبلغ پرداخت‌شده (تومان)</span><input type="number" min="0" class="inp" id="f-paidAmount" value="${esc(s.paidAmount ?? 0)}" /></label>
    <div class="total-preview" id="f-due-preview" style="margin-top:-8px;">
      مبلغ مانده: <b>${fmt(toNum(s.qty)*toNum(s.unitPrice) - toNum(s.paidAmount ?? 0))}</b> تومان
    </div>
    <label class="field"><span class="lbl">شماره پیگیری پرداخت (اختیاری)</span>
      <input class="inp" id="f-paymentTrackingNumber" value="${esc(s.paymentTrackingNumber)}" placeholder="شماره پیگیری رسید پرداخت مشتری" />
    </label>
    ${editing ? `<div class="hint" style="margin:-8px 0 14px;">شماره پیگیری این فاکتور: <span style="font-family:monospace;">${esc(s.id)}</span></div>` : ""}
    <label class="field"><span class="lbl">مشتری (اختیاری)</span>
      <select class="inp" id="f-customerId">
        <option value="">— بدون مشتری خاص —</option>
        ${DB.customers.map(c => `<option value="${c.id}" ${matchedCustomer && matchedCustomer.id===c.id ? 'selected':''}>${esc(c.fullName)}${c.phone ? ' — ' + esc(c.phone) : ''}</option>`).join("")}
        <option value="__custom__" ${isCustomCustomer ? 'selected':''}>نام دیگر (تایپ دستی)</option>
      </select>
      <input class="inp" id="f-customer-custom" style="margin-top:8px;${isCustomCustomer ? '' : 'display:none;'}" value="${esc(isCustomCustomer ? s.customer : '')}" placeholder="نام مشتری" />
      ${DB.customers.length === 0 ? `<span class="hint">هنوز مشتری‌ای در بخش «مشتریان» ثبت نشده؛ می‌توانید همین‌جا نام آزاد تایپ کنید.</span>` : ""}
    </label>
    <label class="field"><span class="lbl">توضیحات (اختیاری)</span><textarea class="inp" id="f-note" rows="2">${esc(s.note)}</textarea></label>
    <div class="modal-actions">
      <button class="btn primary full" data-action="save-sale" data-id="${editing ? s.id : ''}" data-batch-id="${batchId}">ذخیره</button>
      <button class="btn secondary full" data-action="close-modal">انصراف</button>
    </div>
  `);
  const upd = () => {
    const total = toNum(document.getElementById("f-qty").value) * toNum(document.getElementById("f-unitPrice").value);
    document.getElementById("f-total-preview").textContent = fmt(total);
    const due = total - toNum(document.getElementById("f-paidAmount").value);
    document.getElementById("f-due-preview").innerHTML = `مبلغ مانده: <b>${fmt(due)}</b> تومان`;
  };
  document.getElementById("f-qty").addEventListener("input", upd);
  document.getElementById("f-unitPrice").addEventListener("input", upd);
  document.getElementById("f-paidAmount").addEventListener("input", upd);
  document.getElementById("f-customerId").addEventListener("change", (e) => {
    document.getElementById("f-customer-custom").style.display = e.target.value === "__custom__" ? "" : "none";
  });
  wireJalaliDateField("f-date");
}

async function saveSaleFromModal(id, batchId){
  const qty = document.getElementById("f-qty").value;
  const unitPrice = document.getElementById("f-unitPrice").value;
  if(!qty || !unitPrice){ modalErr("مقدار و قیمت واحد الزامی است."); document.getElementById("modal-err").style.display="block"; return; }

  const customerSel = document.getElementById("f-customerId").value;
  let customerId = "", customerName = "";
  if(customerSel === "__custom__"){
    customerName = document.getElementById("f-customer-custom").value.trim();
  }else if(customerSel){
    customerId = customerSel;
    const c = DB.customers.find(x => x.id === customerSel);
    customerName = c ? c.fullName : "";
  }

  const payload = {
    batchId, date: document.getElementById("f-date").value, qty: toNum(qty), unitPrice: toNum(unitPrice),
    unit: document.getElementById("f-unit").value,
    paidAmount: toNum(document.getElementById("f-paidAmount").value),
    paymentTrackingNumber: document.getElementById("f-paymentTrackingNumber").value.trim(),
    customer: customerName,
    customerId: customerId || null,
    note: document.getElementById("f-note").value.trim(),
  };
  try{
    let result;
    if(id) result = await api("/sales/" + id, { method:"PUT", body: payload });
    else result = await api("/sales", { method:"POST", body: payload });
    closeModal();
    await reloadBatchAndList(batchId);
    if(result && result.warning){ UI.saveError = result.warning; render(); }
  }catch(err){
    modalErr(err.message); document.getElementById("modal-err").style.display="block";
  }
}

async function deleteSale(id, batchId){
  try{
    await api("/sales/" + id, { method:"DELETE" });
    await reloadBatchAndList(batchId);
  }catch(err){ UI.saveError = err.message; render(); }
}

/* ===================== event delegation ===================== */

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-action]");
  if(!el){
    if(UI.menuOpen && !e.target.closest("nav.tabs") && !e.target.closest(".hamburger")){
      UI.menuOpen = false; render();
    }
    return;
  }
  if(el.hasAttribute("disabled")) return;

  const action = el.dataset.action;
  const id = el.dataset.id;
  const batchId = el.dataset.batchId;

  switch(action){
    case "toggle-menu": UI.menuOpen = !UI.menuOpen; render(); break;
    case "set-tab": UI.tab = el.dataset.tab; UI.openBatchId = null; UI.batchDetail = null; UI.menuOpen = false; await loadForTab(UI.tab); break;
    case "logout": logout(); break;

    case "open-batch": await openBatchDetailAction(id); break;
    case "back-to-batches": UI.openBatchId = null; UI.batchDetail = null; render(); break;

    case "new-batch": openBatchModal(null); break;
    case "edit-batch": openBatchModal(UI.batchDetail && UI.batchDetail.id === id ? UI.batchDetail : DB.batches.find(b => b.id === id)); break;
    case "delete-batch": await deleteBatch(id); break;
    case "save-batch": await saveBatchFromModal(id || null); break;

    case "new-purchase": await openPurchaseModal(batchId, null); break;
    case "edit-purchase": await openPurchaseModal(UI.openBatchId, (UI.batchDetail.purchases || []).find(p => p.id === id)); break;
    case "delete-purchase": await deletePurchase(id, batchId); break;
    case "save-purchase": await savePurchaseFromModal(id || null, batchId); break;

    case "new-sale": openSaleModal(batchId, null); break;
    case "edit-sale": openSaleModal(UI.openBatchId, (UI.batchDetail.sales || []).find(s => s.id === id)); break;
    case "delete-sale": await deleteSale(id, batchId); break;
    case "save-sale": await saveSaleFromModal(id || null, batchId); break;

    case "new-customer": openCustomerModal(null); break;
    case "edit-customer": openCustomerModal(DB.customers.find(c => c.id === id)); break;
    case "delete-customer": await deleteCustomer(id); break;
    case "save-customer": await saveCustomerFromModal(id || null); break;

    case "new-item": openItemModal(null); break;
    case "edit-item": openItemModal(DB.items.find(i => i.id === id)); break;
    case "delete-item": await deleteItem(id); break;
    case "save-item": await saveItemFromModal(id || null); break;
    case "stock-up": await adjustStock(id, 1); break;
    case "stock-down": await adjustStock(id, -1); break;

    case "new-user": openUserModal(null); break;
    case "edit-user": openUserModal(DB.users.find(u => u.id === id)); break;
    case "delete-user": await deleteUser(id); break;
    case "save-user": await saveUserFromModal(id || null); break;

    case "logs-refresh": await loadLogs(); render(); break;
    case "logs-apply-filter":
      UI.logFilters.entityType = document.getElementById("log-f-entityType").value;
      UI.logFilters.action = document.getElementById("log-f-action").value;
      UI.logFilters.q = document.getElementById("log-f-q").value.trim();
      UI.logFilters.page = 1;
      await loadLogs(); render();
      break;
    case "logs-clear-filter":
      UI.logFilters = { entityType:"", action:"", q:"", page:1, limit:50 };
      await loadLogs(); render();
      break;
    case "logs-prev-page":
      if(UI.logFilters.page > 1){ UI.logFilters.page -= 1; await loadLogs(); render(); }
      break;
    case "logs-next-page":
      UI.logFilters.page += 1; await loadLogs(); render();
      break;

    case "integration-save": await saveIntegrationSettings(); break;
    case "integration-test": await testIntegrationConnection(); break;
    case "integration-sync": await syncIntegrationOrders(); break;

    case "weborders-apply-filter":
      UI.webOrderFilters.status = document.getElementById("wo-f-status").value;
      UI.webOrderFilters.q = document.getElementById("wo-f-q").value.trim();
      UI.webOrderFilters.page = 1;
      await loadWebOrders(); render();
      break;
    case "weborders-clear-filter":
      UI.webOrderFilters = { status:"", q:"", page:1, limit:30 };
      await loadWebOrders(); render();
      break;
    case "weborders-prev-page":
      if(UI.webOrderFilters.page > 1){ UI.webOrderFilters.page -= 1; await loadWebOrders(); render(); }
      break;
    case "weborders-next-page":
      UI.webOrderFilters.page += 1; await loadWebOrders(); render();
      break;

    case "close-modal": closeModal(); break;
  }
});

document.addEventListener("change", async (e) => {
  const el = e.target.closest('[data-action="weborder-assign-batch"]');
  if(!el) return;
  const id = el.dataset.id;
  const batchId = el.value || null;
  try{
    await api("/web-orders/" + id + "/assign-batch", { method:"PATCH", body:{ batchId } });
    await loadWebOrders();
    render();
  }catch(err){
    UI.saveError = err.message;
    render();
  }
});

async function saveIntegrationSettings(){
  UI.integrationBusy = true; UI.integrationMessage = ""; render();
  const payload = {
    siteUrl: document.getElementById("int-siteUrl").value.trim(),
    consumerKey: document.getElementById("int-consumerKey").value.trim(),
    consumerSecret: document.getElementById("int-consumerSecret").value.trim(),
  };
  try{
    DB.integrationSettings = await api("/integrations/woocommerce", { method:"PUT", body: payload });
    UI.integrationMessage = "تنظیمات ذخیره شد. حالا اتصال را تست کنید.";
  }catch(err){
    UI.saveError = err.message;
  }
  UI.integrationBusy = false;
  render();
}

async function testIntegrationConnection(){
  UI.integrationBusy = true; UI.integrationMessage = ""; UI.saveError = ""; render();
  try{
    const result = await api("/integrations/woocommerce/test", { method:"POST" });
    UI.integrationMessage = result.message;
    DB.integrationSettings = await api("/integrations/woocommerce");
  }catch(err){
    UI.saveError = err.message;
  }
  UI.integrationBusy = false;
  render();
}

async function syncIntegrationOrders(){
  UI.integrationBusy = true; UI.integrationMessage = ""; UI.saveError = ""; render();
  try{
    const result = await api("/integrations/woocommerce/sync", { method:"POST" });
    UI.integrationMessage = `${fmt(result.upserted)} سفارش همگام‌سازی شد.`;
    DB.integrationSettings = await api("/integrations/woocommerce");
    await loadWebOrders();
  }catch(err){
    UI.saveError = err.message;
  }
  UI.integrationBusy = false;
  render();
}

async function openBatchDetailAction(id){
  UI.openBatchId = id;
  UI.batchDetail = null;
  render();
  try{
    UI.batchDetail = await api("/batches/" + id);
  }catch(err){
    UI.saveError = err.message;
  }
  render();
}

/* ===================== boot ===================== */

async function boot(){
  const saved = loadAuthFromStorage();
  if(saved && saved.token && saved.user){
    AUTH.token = saved.token;
    AUTH.user = saved.user;
    try{
      // نشست را با سرور اعتبارسنجی می‌کنیم (اگر توکن منقضی شده باشد، خودکار خارج می‌شویم)
      const fresh = await api("/auth/me");
      AUTH.user = fresh;
      saveAuthToStorage();
      await afterLogin();
      return;
    }catch(e){
      // api() در صورت 401 خودش AUTH را پاک و صفحه ورود را نشان داده؛
      // برای خطاهای دیگر (مثلاً قطعی شبکه) هم صفحه ورود را نشان می‌دهیم.
      render();
      return;
    }
  }
  render();
}

boot();
</script>
